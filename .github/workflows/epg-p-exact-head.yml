name: EPG-P exact-head verification

on:
  push:
    branches:
      - verification/epg-p-exact-head

permissions:
  contents: read

jobs:
  verify-epg-p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 99b6b352358636b68b33aab019d1de6becbf4666
          fetch-depth: 0

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "99b6b352358636b68b33aab019d1de6becbf4666"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen build
        run: npm run tizen:build

      - name: Clean tracked diff
        run: git diff --exit-code

      - name: Diff check against exact base
        run: git diff --check 87ff82fac2a449b5a44b5337ac9a03b6ba0419c7...HEAD
