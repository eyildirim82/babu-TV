name: m1c-wire

on:
  push:
    branches:
      - refactor/m1c-playback-boundary

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/m1c-playback-boundary
          fetch-depth: 1

      - name: Apply exact wiring patch
        run: node tools/m1c-wire.mjs

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- player/src/main.js player/src/player.js

      - name: Remove one-shot tooling
        run: git rm tools/m1c-wire.mjs .github/workflows/m1c-wire.yml

      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add player/src/main.js player/src/player.js
          git commit -m "refactor(playback): route legacy engines through adapters"
          git push origin HEAD:refactor/m1c-playback-boundary
