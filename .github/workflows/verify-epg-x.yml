name: verify-epg-x-exact-head

on:
  push:
    branches:
      - verification/epg-x-052751a

permissions:
  contents: read

jobs:
  exact-head-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout final production head explicitly
        uses: actions/checkout@v4
        with:
          ref: 052751aec5f84fb5a1297589a257fa70930cd653
          fetch-depth: 0

      - name: Assert exact production head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "052751aec5f84fb5a1297589a257fa70930cd653"
          git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Brand check
        run: npm run brand:check

      - name: Tizen build
        run: npm run tizen:build

      - name: Ensure tracked tree is clean
        run: git diff --exit-code

      - name: Check frozen-base diff whitespace
        run: git diff --check aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD
