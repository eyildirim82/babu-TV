name: PAIR-C canonical verification

on:
  pull_request:
    paths:
      - '.github/workflows/pair-c-canonical-verification.yml'

permissions:
  contents: read

jobs:
  verify-pair-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 6806175956190d95f55f0ff6b3d732bf087d3999
          fetch-depth: 0

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "6806175956190d95f55f0ff6b3d732bf087d3999"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen build
        run: npm run tizen:build

      - name: Ensure gates did not modify tracked files
        run: git diff --exit-code

      - name: Exact-base diff check
        run: git diff --check b55a01642cd03a555712dd64026f3e22f1a81323...HEAD

      - name: Assert exact changed-file scope
        shell: bash
        run: |
          actual="$(git diff --name-only b55a01642cd03a555712dd64026f3e22f1a81323...HEAD | sort)"
          expected="$(printf '%s\n' 'player/src/pairing/crypto.ts' 'player/test-ts/pairing-crypto.test.ts' | sort)"
          printf 'Changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"
