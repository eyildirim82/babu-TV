name: pair-wire-lockgen

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: write

jobs:
  lockgen:
    if: ${{ !contains(github.event.head_commit.message, 'chore(pairing): pin exact QR dependencies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --save-exact qrcode@1.5.4 -w player
      - run: npm install -D --save-exact @types/qrcode@1.5.6 -w player
      - name: Commit only exact QR dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player/package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(pairing): pin exact QR dependencies"
          git push origin HEAD:integration/pairing-onboarding
