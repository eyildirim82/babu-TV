name: b0a-final-verification

on:
  push:
    branches:
      - refactor/b0a-product-identity

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current B0A branch head
        uses: actions/checkout@v4
        with:
          ref: refactor/b0a-product-identity
          fetch-depth: 1

      - name: Record exact checked-out head
        run: |
          echo "VERIFY_HEAD=$(git rev-parse HEAD)"
          echo "VERIFY_SHORT_HEAD=$(git rev-parse --short HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Focused B0A identity test
        run: node --test player/test/brand-identity.test.js

      - name: Legacy brand scanner
        run: npm run brand:check

      - name: Full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Browser production build
        run: npm run build

      - name: Tizen stage build
        run: npm run tizen:build

      - name: Validate staged canonical manifest
        shell: bash
        run: |
          grep -F 'id="BabusTVApp.BabusTV"' tizen/build/config.xml
          grep -F 'package="BabusTVApp"' tizen/build/config.xml
          grep -F '<name>BABUŞ TV</name>' tizen/build/config.xml
          grep -F 'required_version="5.0"' tizen/build/config.xml
          grep -F 'version="1.10.1"' tizen/build/config.xml

      - name: Build custom signed Tizen package
        shell: bash
        run: |
          npm run tizen
          short_head="$(git rev-parse --short HEAD)"
          test -f "beta/babustv_beta_v1.10.1_${short_head}.wgt"
          ls -lh "beta/babustv_beta_v1.10.1_${short_head}.wgt"

      - name: Report official Tizen CLI availability
        shell: bash
        run: |
          if [ -x /opt/tizen-studio/tools/ide/bin/tizen ]; then
            echo "Official Tizen Studio CLI detected; this repository's official helper is Windows-oriented and requires TIZEN_STUDIO/profile configuration."
          else
            echo "OFFICIAL_TIZEN_PACKAGE=SKIPPED: hosted runner has no configured Tizen Studio CLI/signing profile"
          fi
