name: EPG XML exact-head evidence

on:
  push:
    branches:
      - verify/epg-xml-exact-head-20260910

permissions:
  contents: read

jobs:
  exact-head-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: f28dc56ad597f38f5d490d5a2b3a88fec3e43d2c
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "f28dc56ad597f38f5d490d5a2b3a88fec3e43d2c"

      - name: Brand check
        run: npm run brand:check

      - name: Tizen build
        run: npm run tizen:build

      - name: Ensure verification did not modify tracked files
        run: git diff --exit-code

      - name: Frozen-base diff check
        run: git diff --check aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD

      - name: Exact scope audit
        shell: bash
        run: |
          actual="$(git diff --name-only aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD | sort)"
          expected="$(printf '%s\n' 'player/src/epg/xmltv-parser.ts' 'player/test-ts/epg-xmltv-parser.test.ts' | sort)"
          printf 'Changed files from frozen base:\n%s\n' "$actual"
          test "$actual" = "$expected"
