name: HOME-UI exact-head verification

on:
  push:
    branches:
      - verification/home-ui-0356abbf

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact HOME-UI production head
        uses: actions/checkout@v4
        with:
          ref: 0356abbf8b94e24b9cc1f0ff27812a440a2dd57b
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen stage build
        run: npm run tizen:build

      - name: Tizen package flow requested by worker prompt
        run: npm run tizen

      - name: Requested npm run brand compatibility probe
        run: |
          if npm run brand; then
            echo "npm run brand is available"
          else
            echo "npm run brand is not defined; canonical repository gate is npm run brand:check"
          fi

      - name: Ensure verification leaves tracked files clean
        run: git diff --exit-code

      - name: Exact-base diff check
        run: git diff --check b55a01642cd03a555712dd64026f3e22f1a81323...HEAD
