name: prov-reentry-i-task1-green

on:
  push:
    branches:
      - verification/prov-reentry-i-task1-green

permissions:
  contents: read

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Task 1 revision
        uses: actions/checkout@v4
        with:
          ref: 894d7b804e75cc30ff124c2aec9a7990360ec2e3

      - name: Assert exact Task 1 SHA
        run: test "$(git rev-parse HEAD)" = "894d7b804e75cc30ff124c2aec9a7990360ec2e3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Task 1 focused GREEN tests
        run: node --import tsx --test player/test-ts/provider-reentry-service.test.ts player/test-ts/provider-management-presenter.test.ts
