name: fav-ui-exact-head-gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-head-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact FAV-UI production head
        uses: actions/checkout@v4
        with:
          ref: 2e610f515c79d28fa0322e448af29c1416c11127
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "2e610f515c79d28fa0322e448af29c1416c11127"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand separation gate
        run: npm run brand:check

      - name: Build production player
        run: npm run build

      - name: Tizen staging gate
        run: npm run tizen:build

      - name: Exact base diff check
        run: git diff --check 7b9b61cc099907535f570fb46f30997581a06995...2e610f515c79d28fa0322e448af29c1416c11127

      - name: Ensure gates do not modify tracked files
        run: git diff --exit-code
