name: pair-wire-tdd

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  task5-exact:
    if: "${{ github.event.head_commit.message == 'chore(pairing): verify Task 5 relay GREEN' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee25cc32f4ba0a258395bc9f0e0b200c1e15be4c
      - name: Assert Task 5 exact head
        run: test "$(git rev-parse HEAD)" = "ee25cc32f4ba0a258395bc9f0e0b200c1e15be4c"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused Task 5 regression
        run: >-
          node --import tsx --test
          player/test-ts/pairing-tv-controller.test.ts
          player/test-ts/pairing-tv-core.test.ts
          player/test-ts/pairing-browser-transport.test.ts
          player/test-ts/pairing-bootstrap-link.test.ts
          player/test-ts/pairing-tv-view.test.ts
          player/test-ts/pairing-browser-app-dependencies.test.ts
          player/test-ts/m5-app-composition.test.ts
      - name: Typecheck Task 5 exact head
        run: npm run typecheck
