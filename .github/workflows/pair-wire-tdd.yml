name: pair-wire-tdd

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  task6-exact:
    if: "${{ github.event.head_commit.message == 'chore(pairing): verify Task 6 GREEN' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f2d154db0927dbcce958053af7fe256251b0364
      - name: Assert Task 6 exact head
        run: test "$(git rev-parse HEAD)" = "4f2d154db0927dbcce958053af7fe256251b0364"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused Task 6 regression
        run: node --test player/test/m3-live-tv-wiring.test.js
      - name: Typecheck Task 6 exact head
        run: npm run typecheck
