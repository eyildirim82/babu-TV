name: pair-wire-tdd

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  task4-exact:
    if: "${{ github.event.head_commit.message == 'chore(pairing): verify Task 4 fixture fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70b4846306c1758a65a541dcc321f64a3ffa9773
      - name: Assert Task 4 exact head
        run: test "$(git rev-parse HEAD)" = "70b4846306c1758a65a541dcc321f64a3ffa9773"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused Task 4 regression
        run: node --import tsx --test player/test-ts/m5-app-composition.test.ts
      - name: Typecheck Task 4 exact head
        run: npm run typecheck
