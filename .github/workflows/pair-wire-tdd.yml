name: pair-wire-tdd

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  task6-red:
    if: "${{ github.event.head_commit.message == 'chore(pairing): verify Task 6 RED' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 339fcf336b7c158a302c8cab05a53df27178352d
      - name: Assert Task 6 RED head
        run: test "$(git rev-parse HEAD)" = "339fcf336b7c158a302c8cab05a53df27178352d"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused Task 6 RED
        run: node --test player/test/m3-live-tv-wiring.test.js
