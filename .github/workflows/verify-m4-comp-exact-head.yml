name: verify-m4-comp-exact-head

on:
  pull_request:
    paths:
      - .github/workflows/verify-m4-comp-exact-head.yml

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact M4-COMP production head
        uses: actions/checkout@v4
        with:
          ref: 1932087497b5f38af56388cdcddc7b9f926202ea
          fetch-depth: 0

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "1932087497b5f38af56388cdcddc7b9f926202ea"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen staging build
        run: npm run tizen:build

      - name: Ensure gates did not modify tracked files
        run: git diff --exit-code

      - name: Exact-base diff check
        run: git diff --check b55a01642cd03a555712dd64026f3e22f1a81323...HEAD

      - name: Assert exact M4-COMP scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            player/src/live-tv/create-live-tv-runtime.ts \
            player/src/live-tv/dom-live-tv-view.ts \
            player/src/live-tv/live-tv-controller.ts \
            player/src/live-tv/live-tv-feature-composition.ts \
            player/test-ts/m4-live-tv-composition.test.ts \
            player/test-ts/m4-live-tv-dom.test.ts \
            player/test-ts/m4-live-tv-runtime.test.ts | sort)"
          actual="$(git diff --name-only b55a01642cd03a555712dd64026f3e22f1a81323...HEAD | sort)"
          test "$actual" = "$expected"
