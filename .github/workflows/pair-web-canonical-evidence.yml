name: pair-web-canonical-evidence

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  canonical-evidence:
    if: github.head_ref == 'feature/pairing-phone-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 372d4e947264fb067ece78e15af887bc0d9ccaae
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "372d4e947264fb067ece78e15af887bc0d9ccaae"
      - name: Install dependencies
        run: npm ci
      - name: Focused phone UI test
        run: node --import tsx --test player/test-ts/pairing-phone-ui.test.ts
      - name: Focused payload test
        run: node --import tsx --test player/test-ts/pairing-phone-payload.test.ts
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Brand check
        run: npm run brand:check
      - name: Production build
        run: npm run build
      - name: Tizen build staging
        run: npm run tizen:build
      - name: Ensure gates leave tracked tree clean
        run: git diff --exit-code
      - name: Exact-base diff check
        run: git diff --check 860d9efa8efac7c9872bf31f7f592ae12a414889...HEAD
      - name: Assert PAIR-WEB scope
        shell: bash
        run: |
          printf '%s\n' \
            player/src/pairing/phone-controller.ts \
            player/src/pairing/phone-payload.ts \
            player/src/pairing/phone-view.ts \
            player/src/ui/pairing-phone.css \
            player/test-ts/pairing-phone-payload.test.ts \
            player/test-ts/pairing-phone-ui.test.ts > /tmp/expected
          git diff --name-only 860d9efa8efac7c9872bf31f7f592ae12a414889...HEAD | sort > /tmp/actual
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/actual
