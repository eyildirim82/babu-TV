name: sec-final-focused-exact-head

on:
  push:
    branches:
      - verification/sec-final-focused-4039d46

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4039d46b484612f66cfb4d6038eaac299ca36977
          fetch-depth: 0
      - name: Assert exact final head
        run: test "$(git rev-parse HEAD)" = "4039d46b484612f66cfb4d6038eaac299ca36977"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused M7 SEC audit
        run: npx tsx --test player/test-ts/m7-security-privacy-audit.test.ts
      - name: Focused M7 SEC static audit
        run: node tools/check-m7-security-privacy.mjs
