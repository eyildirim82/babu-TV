name: pair-web-red-evidence

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  focused-red:
    if: github.head_ref == 'feature/pairing-phone-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RED production head
        uses: actions/checkout@v4
        with:
          ref: 108e2c50f0d2db1c5ef05f85ec232788244fbb3c
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert exact RED head
        run: test "$(git rev-parse HEAD)" = "108e2c50f0d2db1c5ef05f85ec232788244fbb3c"
      - name: Install dependencies
        run: npm ci
      - name: Assert focused regression is RED
        shell: bash
        run: |
          set +e
          output=$(node --import tsx --test player/test-ts/pairing-phone-ui.test.ts 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "PAIR-WEB rejects bootstrap with unknown top-level key before crypto or relay"
          printf '%s\n' "$output" | grep -F "PAIR-WEB rejects bootstrap with a missing top-level key before crypto or relay"
