name: rc-browser

on:
  push:
    branches:
      - verification/v1-rc-browser

permissions:
  contents: read

jobs:
  browser-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Build production player
        run: npm run build

      - name: Run repository tests
        run: npm test

      - name: Run H0 browser smoke
        run: npm run rc:browser -- tools/rc-browser/specs/harness-smoke.spec.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Assert exact Playwright dependency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.devDependencies?.['@playwright/test'] !== '1.63.0') process.exit(1);
          if (lock.packages?.['']?.devDependencies?.['@playwright/test'] !== '1.63.0') process.exit(1);
          if (lock.packages?.['node_modules/@playwright/test']?.version !== '1.63.0') process.exit(1);
          NODE

      - name: Diff check against frozen production base
        run: git diff --check 409e416c88f0bd12666302fdaab533a626421a29...HEAD

      - name: Assert production source untouched
        run: |
          if git diff --name-only 409e416c88f0bd12666302fdaab533a626421a29...HEAD | grep -q '^player/src/'; then
            echo 'Forbidden player/src change detected.'
            exit 1
          fi

      - name: Assert H0-only scope before worker integration
        run: |
          if find tools/rc-browser/specs -maxdepth 1 -name 'pack-*.spec.mjs' -print -quit | grep -q .; then
            echo 'Worker specs present; H0-only scope assertion is no longer applicable.'
            exit 0
          fi
          allowed='^(package\.json|package-lock\.json|\.gitignore|\.github/workflows/rc-browser\.yml|tools/rc-browser/playwright\.config\.mjs|tools/rc-browser/lib/harness\.mjs|tools/rc-browser/lib/widgetdata-stub\.mjs|tools/rc-browser/lib/provider-mocks\.mjs|tools/rc-browser/lib/evidence\.mjs|tools/rc-browser/fixtures/common\.mjs|tools/rc-browser/specs/harness-smoke\.spec\.mjs)$'
          unexpected="$(git diff --name-only 409e416c88f0bd12666302fdaab533a626421a29...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected H0 paths:'
            echo "$unexpected"
            exit 1
          fi

      - name: Ensure verification did not modify tracked files
        run: git diff --exit-code

      - name: Upload sanitized H0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc-browser-h0-evidence-${{ github.sha }}
          path: rc-browser-artifacts/
          if-no-files-found: error
          retention-days: 14
