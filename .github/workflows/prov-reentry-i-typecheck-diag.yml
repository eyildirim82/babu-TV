name: prov-reentry-i-typecheck-diag

on:
  push:
    branches:
      - verification/prov-reentry-i-typecheck-diag

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production revision
        uses: actions/checkout@v4
        with:
          ref: 4e3b393fc643c9bb893776ff638b1023788b5e67
      - name: Assert exact production SHA
        run: test "$(git rev-parse HEAD)" = "4e3b393fc643c9bb893776ff638b1023788b5e67"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture typecheck output
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Preserve failure status
        if: steps.typecheck.outcome != 'success'
        run: exit 1
