name: m3u-v-exact-head-gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-head-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout M3U-V exact head
        uses: actions/checkout@v4
        with:
          ref: ef15155f3bf011f97f332d1bf0b4717a46dd237c

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "ef15155f3bf011f97f332d1bf0b4717a46dd237c"

      - name: Brand separation gate
        run: npm run brand:check

      - name: Tizen staging gate
        run: npm run tizen:build

      - name: Ensure gates do not modify tracked files
        run: git diff --exit-code
