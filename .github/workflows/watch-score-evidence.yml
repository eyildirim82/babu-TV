name: WATCH-S exact-head evidence

on:
  push:
    branches:
      - verify/watch-score-de1186a

permissions:
  contents: read

jobs:
  exact-head-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: de1186a2556faff1b11360e1aff2fca010cc252f
          fetch-depth: 0

      - name: Prove exact production head
        run: |
          test "$(git rev-parse HEAD)" = "de1186a2556faff1b11360e1aff2fca010cc252f"
          git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Brand check
        run: npm run brand:check

      - name: Tizen build
        run: npm run tizen:build

      - name: Ensure commands did not modify tracked files
        run: git diff --exit-code

      - name: Frozen-base whitespace check
        run: git diff --check aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD

      - name: Verify exact scope
        shell: bash
        run: |
          actual="$(git diff --name-only aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD | sort)"
          expected="$(printf '%s\n' 'player/src/watch/score.ts' 'player/test-ts/watch-score.test.ts' | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
