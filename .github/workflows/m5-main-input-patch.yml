name: m5-main-input-patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-main:
    if: github.event.pull_request.head.ref == 'integration/m5-app-composition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/m5-app-composition
      - name: Inject legacy adapters into typed app dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('player/src/main.js')
          text = path.read_text()
          old = "      platform,\n      document,\n      setRemoteNumericMode: setAppRemoteNumericMode,\n"
          new = "      platform,\n      document,\n      legacyPlayer,\n      legacyAvplay,\n      setRemoteNumericMode: setAppRemoteNumericMode,\n"
          assert text.count(old) == 1
          assert text.count('      legacyPlayer,\n      legacyAvplay,\n      setRemoteNumericMode: setAppRemoteNumericMode,') == 0
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit bounded adapter input patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player/src/main.js
          git commit -m 'fix(m5): inject legacy adapters into app composition'
          git push origin HEAD:integration/m5-app-composition
