name: prov-reentry-i-task1-red

on:
  push:
    branches:
      - verification/prov-reentry-i-task1-red

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact test-only revision
        uses: actions/checkout@v4
        with:
          ref: 5a16056753036e7e8dfa9ee32fcfdf0c26a56fd7

      - name: Assert exact test-only SHA
        run: test "$(git rev-parse HEAD)" = "5a16056753036e7e8dfa9ee32fcfdf0c26a56fd7"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Task 1 focused RED tests
        run: node --import tsx --test player/test-ts/provider-reentry-service.test.ts player/test-ts/provider-management-presenter.test.ts
