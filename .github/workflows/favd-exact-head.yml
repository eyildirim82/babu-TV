name: FAV-D exact-head verification

on:
  push:
    branches:
      - verification/fav-d-exact-head-20260910

permissions:
  contents: read

jobs:
  verify-exact-production-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 3615617359bfb52abb1c38b3f95a436939bd24cc
          fetch-depth: 0

      - name: Assert exact head and FAV-D scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3615617359bfb52abb1c38b3f95a436939bd24cc"
          printf 'Exact production HEAD: %s\n' "$(git rev-parse HEAD)"
          git diff --name-only aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD | sort > /tmp/favd-files.txt
          printf '%s\n' \
            player/src/favorites/service.ts \
            player/test-ts/favorites-service.test.ts | sort > /tmp/favd-expected.txt
          diff -u /tmp/favd-expected.txt /tmp/favd-files.txt
          printf 'Scope audit PASS; changed files:\n'
          cat /tmp/favd-files.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Brand check
        run: npm run brand:check

      - name: Tizen build
        run: npm run tizen:build

      - name: Ensure verification did not modify tracked files
        run: git diff --exit-code

      - name: Diff whitespace check from frozen base
        run: git diff --check aac531b15bad85f6e7ae42c6ff1a6b71eed289d1...HEAD
