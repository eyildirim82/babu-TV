name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SRCH-UI exact production head
        uses: actions/checkout@v4
        with:
          ref: 5eea64fce5d6eb0e8265580bcbd3c9dcf303f6df
          fetch-depth: 0

      - name: Confirm exact production head
        run: test "$(git rev-parse HEAD)" = "5eea64fce5d6eb0e8265580bcbd3c9dcf303f6df"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm run typecheck
        run: npm run typecheck

      - name: Requested npm run brand evidence
        continue-on-error: true
        run: npm run brand

      - name: Canonical brand gate
        run: npm run brand:check

      - name: npm run build
        run: npm run build

      - name: npm run tizen:build
        run: npm run tizen:build

      - name: npm run tizen
        run: npm run tizen

      - name: git diff --exit-code
        run: git diff --exit-code

      - name: Exact-base diff check
        run: git diff --check 7b9b61cc099907535f570fb46f30997581a06995...HEAD
