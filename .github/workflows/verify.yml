name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  tizen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact B0C final head
        uses: actions/checkout@v4
        with:
          ref: b7b0b71718b1222478f4d12f7f5a94a140d77d5a

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tizen staging from exact B0C head
        run: npm run tizen:build

      - name: Verify staged icon is byte-for-byte identical
        run: cmp tizen/icons/icon_128.png tizen/build/icon.png

      - name: Record exact source head
        run: test "$(git rev-parse HEAD)" = "b7b0b71718b1222478f4d12f7f5a94a140d77d5a"
