name: portfolio-screenshots

on:
  push:
    branches:
      - portfolio/babustv-readme
    paths:
      - '.github/workflows/portfolio-screenshots.yml'
      - 'tools/rc-browser/specs/portfolio-screenshots.spec.mjs'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: portfolio/babustv-readme

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Build production player
        run: npm run build

      - name: Capture portfolio screenshots
        run: npm run rc:browser -- tools/rc-browser/specs/portfolio-screenshots.spec.mjs

      - name: Commit screenshots
        shell: bash
        run: |
          set -euo pipefail
          git add docs/screenshots/home.png docs/screenshots/live-tv.png docs/screenshots/search.png
          if git diff --cached --quiet; then
            echo 'No screenshot changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: add BabuşTV portfolio screenshots'
          git push origin HEAD:portfolio/babustv-readme
