name: prov-reentry-i-task3-red

on:
  push:
    branches:
      - verification/prov-reentry-i-task3-red

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Task 3 test-only revision
        uses: actions/checkout@v4
        with:
          ref: 56803cf03c028a0a80c7169b4d134fe3bcc9dc7b
      - name: Assert exact Task 3 test-only SHA
        run: test "$(git rev-parse HEAD)" = "56803cf03c028a0a80c7169b4d134fe3bcc9dc7b"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Task 3 focused RED test
        run: node --import tsx --test player/test-ts/m5-app-composition.test.ts
