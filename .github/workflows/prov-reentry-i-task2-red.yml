name: prov-reentry-i-task2-red

on:
  push:
    branches:
      - verification/prov-reentry-i-task2-red

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Task 2 test-only revision
        uses: actions/checkout@v4
        with:
          ref: acc735bfba32ff3272cf3399d61668c3773aaf69
      - name: Assert exact Task 2 test-only SHA
        run: test "$(git rev-parse HEAD)" = "acc735bfba32ff3272cf3399d61668c3773aaf69"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Task 2 focused RED test
        run: node --import tsx --test player/test-ts/m5-provider-management-surface.test.ts
