name: PROV-UI exact-head full gates

on:
  pull_request:
    branches:
      - verification/prov-ui-exact-head

jobs:
  full-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 36ca3a7abba94aeae6076da919c1c07a0deeb4b9
          fetch-depth: 0

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "36ca3a7abba94aeae6076da919c1c07a0deeb4b9"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen staging build
        run: npm run tizen:build

      - name: Tizen package
        run: npm run tizen

      - name: Ensure gates did not modify tracked files
        run: git diff --exit-code

      - name: Diff whitespace check from exact base
        run: git diff --check 7b9b61cc099907535f570fb46f30997581a06995...HEAD
