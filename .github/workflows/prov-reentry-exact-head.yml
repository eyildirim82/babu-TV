name: PROV-REENTRY exact-head canonical gates

on:
  pull_request:
    branches:
      - verification/prov-reentry-exact-head

permissions:
  contents: read

jobs:
  canonical-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: e096c62eb959aad59ef033f8e748682fc1eaba53
          fetch-depth: 0

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "e096c62eb959aad59ef033f8e748682fc1eaba53"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen staging build
        run: npm run tizen:build

      - name: Ensure gates did not modify tracked files
        run: git diff --exit-code

      - name: Diff whitespace check from frozen base
        run: git diff --check 860d9efa8efac7c9872bf31f7f592ae12a414889...HEAD

      - name: Assert exact production scope
        run: |
          test "$(git diff --name-only 860d9efa8efac7c9872bf31f7f592ae12a414889...HEAD)" = "$(printf '%s\n' \
            player/src/provider-management/provider-management-presenter.ts \
            player/src/providers/provider-reentry-service.ts \
            player/test-ts/provider-management-presenter.test.ts \
            player/test-ts/provider-reentry-service.test.ts)"
