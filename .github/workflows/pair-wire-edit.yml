name: pair-wire-edit

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: write

jobs:
  task4-typecheck-fix:
    if: "${{ github.event.head_commit.message == 'chore(pairing): stage Task 4 typecheck fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Narrow pairing callback fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('player/test-ts/m5-app-composition.test.ts')
          text = path.read_text()
          callback_type = "{ onBack(): void; onCompleted(providerId: string): void }"
          old_completed = "requireBound(pairingCallbacks, 'pairing callbacks').onCompleted('paired-provider');"
          new_completed = f"requireBound<{callback_type}>(pairingCallbacks, 'pairing callbacks').onCompleted('paired-provider');"
          old_back = "requireBound(pairingCallbacks, 'pairing callbacks').onBack();"
          new_back = f"requireBound<{callback_type}>(pairingCallbacks, 'pairing callbacks').onBack();"
          if text.count(old_completed) != 1 or text.count(old_back) != 1:
              raise SystemExit('unexpected pairing callback fixture shape')
          text = text.replace(old_completed, new_completed, 1).replace(old_back, new_back, 1)
          path.write_text(text)
          PY
      - name: Commit Task 4 fixture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player/test-ts/m5-app-composition.test.ts
          git diff --cached --check
          git commit -m "test(app): narrow pairing callback fixtures"
          git push origin HEAD:integration/pairing-onboarding

# temporary execution workflow; removed before final production head
