name: pair-wire-edit

on:
  push:
    branches:
      - integration/pairing-onboarding

permissions:
  contents: write

jobs:
  task5-transport-path-fix:
    if: "${{ github.event.head_commit.message == 'chore(pairing): stage Task 5 transport path fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Fix Task 5 transport import path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('player/src/app/browser-app-dependencies.ts')
          text = path.read_text()
          old = "import { FetchPairingRelayTransport } from '../pairing/browser-relay-transport.js';"
          new = "import { FetchPairingRelayTransport } from '../pairing/fetch-relay-transport.js';"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old import, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit Task 5 transport path fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player/src/app/browser-app-dependencies.ts
          git diff --cached --check
          git commit -m "fix(app): use existing pairing fetch transport"
          git push origin HEAD:integration/pairing-onboarding

# temporary execution workflow; removed before final production head
