name: PROV-REENTRY canonical exact-head

on:
  push:
    branches:
      - feature/provider-reentry

permissions:
  contents: read

env:
  BASE_SHA: 860d9efa8efac7c9872bf31f7f592ae12a414889
  PRODUCTION_SHA: e096c62eb959aad59ef033f8e748682fc1eaba53

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_SHA }}
          fetch-depth: 0

      - name: Assert exact production head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"

      - name: Assert exact owned file scope
        shell: bash
        run: |
          actual="$(git diff --name-only "$BASE_SHA...HEAD" | sort)"
          expected="$(printf '%s\n' \
            'player/src/provider-management/provider-management-presenter.ts' \
            'player/src/providers/provider-reentry-service.ts' \
            'player/test-ts/provider-management-presenter.test.ts' \
            'player/test-ts/provider-reentry-service.test.ts' | sort)"
          printf 'Changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen build
        run: npm run tizen:build

      - name: Assert gates leave tracked tree clean
        run: git diff --exit-code

      - name: Diff check against frozen base
        run: git diff --check "$BASE_SHA...HEAD"
