name: pair-wire-final-canonical

on:
  push:
    branches:
      - verify/pair-i-wire-final

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production head
        uses: actions/checkout@v4
        with:
          ref: 1fd4b603794729d2e1a2b913cc1cbcd5948a6623
          fetch-depth: 0
      - name: Assert immutable production head and frozen base
        run: |
          set -euo pipefail
          BASE=47cd97bb52f34d6b9dfbad5724530f4809fa81b1
          HEAD=1fd4b603794729d2e1a2b913cc1cbcd5948a6623
          test "$(git rev-parse HEAD)" = "$HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
      - name: Assert exact changed-file scope
        run: |
          set -euo pipefail
          BASE=47cd97bb52f34d6b9dfbad5724530f4809fa81b1
          cat > /tmp/expected-files <<'EOF'
          package-lock.json
          player/package.json
          player/src/app/app-composition.ts
          player/src/app/browser-app-dependencies.ts
          player/src/first-run/first-run-view.ts
          player/src/main.js
          player/src/pairing/bootstrap-link.ts
          player/src/pairing/fetch-relay-transport.ts
          player/src/pairing/tv-view.ts
          player/src/ui/pairing-tv.css
          player/test-ts/first-run-view.test.ts
          player/test-ts/m5-app-composition.test.ts
          player/test-ts/pairing-bootstrap-link.test.ts
          player/test-ts/pairing-browser-app-dependencies.test.ts
          player/test-ts/pairing-browser-transport.test.ts
          player/test-ts/pairing-tv-view.test.ts
          player/test/m3-live-tv-wiring.test.js
          EOF
          git diff --name-only "$BASE"...HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          ! grep -q '^\.github/workflows/pair-wire-' /tmp/actual-files
      - name: Assert frozen authority files unchanged
        run: |
          set -euo pipefail
          BASE=47cd97bb52f34d6b9dfbad5724530f4809fa81b1
          test -z "$(git diff --name-only "$BASE"...HEAD -- \
            player/src/pairing/crypto.ts \
            player/src/pairing/session.ts \
            player/src/pairing/relay-contracts.ts \
            player/src/pairing/relay-client.ts \
            player/src/pairing/phone-controller.ts \
            player/src/pairing/phone-payload.ts \
            player/src/pairing/tv-controller.ts \
            player/src/pairing/create-tv-pairing-core.ts)"
      - name: Audit pairing privacy and public configuration boundary
        run: |
          set -euo pipefail
          BASE=47cd97bb52f34d6b9dfbad5724530f4809fa81b1
          PROD_FILES=(
            player/src/app/app-composition.ts
            player/src/app/browser-app-dependencies.ts
            player/src/first-run/first-run-view.ts
            player/src/main.js
            player/src/pairing/bootstrap-link.ts
            player/src/pairing/fetch-relay-transport.ts
            player/src/pairing/tv-view.ts
          )
          git diff -U0 "$BASE"...HEAD -- "${PROD_FILES[@]}" | grep '^+' | grep -v '^+++' > /tmp/added-production || true
          ! grep -E 'https?://' /tmp/added-production
          ! grep -E 'console\.(log|warn|error)' /tmp/added-production
          ! grep -E '(localStorage|sessionStorage)' /tmp/added-production
          ! grep -Ei 'dataset\.(username|password|credential|token|privateKey|playlist)' /tmp/added-production
          ! grep -E '\bprivateKey\b' /tmp/added-production
          grep -q 'window.BABUSTV_PAIRING_CONFIG' player/src/main.js
          ! grep -R '__BABUSTV_PAIRING_CONFIG__' player/src player/test player/test-ts
          node - <<'NODE'
          const pkg = require('./player/package.json');
          if (pkg.dependencies?.qrcode !== '1.5.4') throw new Error('qrcode version not exact');
          if (pkg.devDependencies?.['@types/qrcode'] !== '1.5.6') throw new Error('@types/qrcode version not exact');
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Brand check
        run: npm run brand:check
      - name: Build
        run: npm run build
      - name: Tizen build
        run: npm run tizen:build
      - name: Assert clean working tree
        run: git diff --exit-code
      - name: Diff check against frozen base
        run: git diff --check 47cd97bb52f34d6b9dfbad5724530f4809fa81b1...HEAD
