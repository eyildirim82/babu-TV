name: M3U-C exact-head verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact M3U-C production head
        uses: actions/checkout@v4
        with:
          ref: da45b740c71672e6c48a8420535bf52da8872c35
          fetch-depth: 0

      - name: Assert exact production head
        run: test "$(git rev-parse HEAD)" = "da45b740c71672e6c48a8420535bf52da8872c35"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen staging build
        run: npm run tizen:build

      - name: Clean tracked diff
        run: git diff --exit-code

      - name: Diff whitespace check from exact base
        run: git diff --check 87ff82fac2a449b5a44b5337ac9a03b6ba0419c7...HEAD
