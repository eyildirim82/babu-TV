name: prov-reentry-i-canonical

on:
  push:
    branches:
      - verification/prov-reentry-i-canonical

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact production revision
        uses: actions/checkout@v4
        with:
          ref: 4e3b393fc643c9bb893776ff638b1023788b5e67
          fetch-depth: 0

      - name: Assert exact production SHA and frozen base
        run: |
          test "$(git rev-parse HEAD)" = "4e3b393fc643c9bb893776ff638b1023788b5e67"
          git cat-file -e 92af4f5b9d445ced236a63f581716a55bf87ebeb^{commit}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Tizen build
        run: npm run tizen:build

      - name: Clean tracked diff
        run: git diff --exit-code

      - name: Frozen-base diff check
        run: git diff --check 92af4f5b9d445ced236a63f581716a55bf87ebeb...HEAD

      - name: Assert exact changed files
        shell: bash
        run: |
          actual="$(git diff --name-only 92af4f5b9d445ced236a63f581716a55bf87ebeb...HEAD | sort)"
          expected="$(printf '%s\n' \
            player/src/app/app-composition.ts \
            player/src/app/browser-app-dependencies.ts \
            player/src/app/provider-management-surface.ts \
            player/src/provider-management/provider-management-presenter.ts \
            player/src/providers/provider-reentry-service.ts \
            player/test-ts/m5-app-composition.test.ts \
            player/test-ts/m5-browser-app-dependencies.test.ts \
            player/test-ts/m5-provider-management-surface.test.ts \
            player/test-ts/provider-management-presenter.test.ts \
            player/test-ts/provider-reentry-service.test.ts | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
