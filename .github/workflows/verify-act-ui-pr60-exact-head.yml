name: verify-act-ui-pr60-exact-head

on:
  push:
    branches:
      - verification/act-ui-pr60-exact-head

permissions:
  contents: read

jobs:
  exact-head-full-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 7b9b61cc099907535f570fb46f30997581a06995
      PRODUCTION_HEAD: 472abab1c49219db7b164d4ca9b2db2cd873a1df
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 472abab1c49219db7b164d4ca9b2db2cd873a1df
          fetch-depth: 0

      - name: Assert exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_HEAD"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brand check
        run: npm run brand:check

      - name: Build production player
        run: npm run build

      - name: Stage Tizen build
        run: npm run tizen:build

      - name: Package Tizen widget
        run: npm run tizen

      - name: Assert exact-base diff and ACT-UI scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$PRODUCTION_HEAD"
          actual="$(git diff --name-only "$BASE_SHA...$PRODUCTION_HEAD" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'player/src/channel-actions/channel-actions-model.ts' \
            'player/test-ts/channel-actions-ui.test.ts' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"

      - name: Ensure verification did not modify tracked files
        run: git diff --exit-code
